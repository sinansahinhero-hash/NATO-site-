<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATO</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 15px; }

        .navbar {
            width: 100%; max-width: 480px; background: #ffffff; border-radius: 20px;
            padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); margin-bottom: 20px; border: 1px solid #f1f5f9;
        }

        .logo-area { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.3rem; color: #0f172a; }
        .logo-area span.badge-ta { background: linear-gradient(135deg, #0052ff, #0040cc); color: white; padding: 4px 10px; border-radius: 8px; font-size: 0.9rem; }

        .nav-menu-btn {
            background: #f8fafc; border: 1px solid #e2e8f0; width: 42px; height: 42px;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #334155; font-size: 1.2rem;
        }

        .profile-card {
            width: 100%; max-width: 480px; background: #ffffff; border-radius: 24px;
            padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid #f1f5f9;
            display: flex; flex-direction: column; gap: 18px;
        }

        /* Avatar & Durum Balonu Header */
        .avatar-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-container { position: relative; width: 85px; height: 85px; flex-shrink: 0; }
        .avatar-img { width: 100%; height: 100%; border-radius: 24px; object-fit: cover; border: 1px solid #e2e8f0; }
        
        .role-badge-overlay {
            position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
            background: #f1f5f9; border: 1px solid #cbd5e1; color: #334155;
            font-size: 0.7rem; font-weight: 700; padding: 2px 10px; border-radius: 10px; white-space: nowrap;
        }

        /* Discord Özel Durum Balonu */
        .status-bubble {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            padding: 10px 14px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #334155;
            line-height: 1.35;
            width: 100%;
            display: none; /* Varsayılan gizli, veri varsa görünecek */
        }

        .section-sub { font-size: 0.85rem; font-weight: 700; color: #64748b; margin-top: 5px; }
        .user-title-area { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
        .user-title-area h2 { font-size: 1.4rem; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; }
        .user-title-area .username-tag { font-size: 0.95rem; font-weight: 600; color: #64748b; }
        .user-description { font-size: 0.9rem; color: #334155; font-weight: 600; word-break: break-word; line-height: 1.4; }

        .roles-list { display: flex; gap: 8px; flex-wrap: wrap; }
        .role-pill-ta {
            background: #e2e8f0; color: #334155; font-size: 0.75rem; font-weight: 700;
            padding: 6px 14px; border-radius: 12px; text-transform: uppercase; letter-spacing: 0.5px;
        }

        .info-box {
            background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px;
            padding: 14px 18px; display: flex; flex-direction: column; gap: 4px;
        }
        .info-box-title { font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; }
        .info-box-value { font-size: 1.1rem; font-weight: 800; color: #0f172a; }

        .action-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        
        .btn-ta-primary {
            background: #0052ff; color: #ffffff; border: none; padding: 14px;
            border-radius: 14px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: 0.2s; text-decoration: none; width: 100%;
        }

        .btn-mc {
            background: #0f172a; color: #ffffff; border: none; padding: 14px;
            border-radius: 14px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: 0.2s; text-decoration: none; width: 100%;
        }

        .btn-ta-secondary {
            background: #ffffff; color: #1e293b; border: 1px solid #e2e8f0;
            padding: 13px; border-radius: 14px; font-weight: 700; font-size: 0.9rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: 0.2s; text-decoration: none;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.4); display: none;
            align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px);
        }
        .modal-content { background: #ffffff; width: 90%; max-width: 400px; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo-area"><span class="badge-ta">NATO</span> Komuta</div>
        <button class="nav-menu-btn" onclick="toggleModal()"><i class="fa-solid fa-bars"></i></button>
    </div>

    <!-- Hesap Yönetim Modalı -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-content">
            <h3 style="font-size: 1.2rem; font-weight: 800;">Hesap Yönetimi & Bağlantılar</h3>
            <p style="font-size: 0.85rem; color: #64748b;">Gerekli bağlantı işlemlerini seçin:</p>
            
            <!-- Discord Girişi -->
            <a href="https://discord.com/oauth2/authorize?client_id=1539374890405204070&response_type=token&redirect_uri=https%3A%2F%2Fnatox-mauve.vercel.app&scope=identify+email" class="btn-ta-primary" style="background:#5865F2;">
                <i class="fa-brands fa-discord"></i> Discord Hesabı Bağla
            </a>

            <!-- Minecraft Nick Değiştirme -->
            <button class="btn-mc" onclick="openMcPrompt()">
                <i class="fa-solid fa-cube"></i> Minecraft Oyuncu Adını Ayarla
            </button>

            <button class="btn-ta-secondary" onclick="toggleModal()" style="margin-top: 5px;">Kapat</button>
        </div>
    </div>

    <main class="profile-card">
        
        <!-- Üst Avatar ve Özel Durum Balonu -->
        <div class="avatar-header">
            <div class="avatar-container">
                <img src="https://cdn.discordapp.com/embed/avatars/0.png" class="avatar-img" id="userAvatar" alt="Avatar">
                <div class="role-badge-overlay" id="topBadge">Misafir</div>
            </div>
            <!-- Discord Özel Durum Balonu (Canlı) -->
            <div class="status-bubble" id="statusBubble"></div>
        </div>

        <div class="section-sub">Üye Profili</div>

        <!-- Kullanıcı İsimleri ve Biyografi -->
        <div>
            <div class="user-title-area">
                <h2 id="displayName">Giriş Yapılmadı</h2>
                <span class="username-tag" id="usernameTag">@misafir</span>
            </div>
            
            <!-- Canlı Biyografi Alanı -->
            <div style="margin-top: 10px;">
                <span style="font-size: 0.75rem; font-weight: 700; color: #94a3b8; text-transform: uppercase;">BİYOGRAFİ</span>
                <p class="user-description" id="userDesc" style="margin-top: 2px;">
                    Topluluğa henüz giriş yapılmadı.
                </p>
            </div>
        </div>

        <div class="roles-list" id="rolesList">
            <span class="role-pill-ta" style="color: #ff3344;">Yetkisiz Misafir</span>
        </div>

        <!-- Minecraft IGN Kutusu -->
        <div class="info-box">
            <div class="info-box-title">MİNECRAFT OYUNCU ADI (IGN)</div>
            <div class="info-box-value" id="mcTag" style="color: #0f172a;">Henüz Girilmedi</div>
        </div>

        <div class="action-buttons">
            <button class="btn-ta-primary" onclick="toggleModal()" id="loginActionBtn">
                <i class="fa-solid fa-link"></i> Hesapları Yönet / Bağlan
            </button>
            
            <button class="btn-ta-secondary" onclick="logout()">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Siteden Çıkış Yap / Sıfırla
            </button>
        </div>
    </main>

    <script>
        function toggleModal() {
            const m = document.getElementById('loginModal');
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        }

        function openMcPrompt() {
            const mcName = prompt("Minecraft Oyuncu Adınızı (IGN) girin:");
            if (mcName && mcName.trim() !== "") {
                localStorage.setItem('nato_mc_nick', mcName.trim());
                alert("Minecraft nickiniz (" + mcName.trim() + ") kaydedildi!");
                toggleModal();
                updateUI();
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = "https://natox-mauve.vercel.app";
        }

        window.onload = async function() {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');

            if (accessToken) {
                try {
                    const res = await fetch('https://discord.com/api/users/@me', {
                        headers: { authorization: `Bearer ${accessToken}` }
                    });
                    const userData = await res.json();

                    if (userData.id) {
                        const avatarUrl = userData.avatar 
                            ? `https://cdn.discordapp.com/avatars/${userData.id}/${userData.avatar}.png?size=256`
                            : `https://cdn.discordapp.com/embed/avatars/0.png`;

                        const userObj = {
                            id: userData.id,
                            username: userData.username,
                            global_name: userData.global_name || userData.username,
                            avatarUrl: avatarUrl,
                            bio: userData.bio || ""
                        };

                        localStorage.setItem('nato_user', JSON.stringify(userObj));
                        localStorage.setItem('nato_logged_in', 'true');
                    }
                } catch (err) {
                    console.error("Discord profil çekme hatası:", err);
                }
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            updateUI();
        };

        function updateUI() {
            const isLoggedIn = localStorage.getItem('nato_logged_in');
            const userData = JSON.parse(localStorage.getItem('nato_user') || '{}');
            const savedMc = localStorage.getItem('nato_mc_nick') || '';

            if (savedMc) {
                document.getElementById('mcTag').innerText = savedMc;
            } else {
                document.getElementById('mcTag').innerText = "Henüz Girilmedi";
            }

            if (isLoggedIn === 'true' && userData.username) {
                document.getElementById('userAvatar').src = userData.avatarUrl;
                document.getElementById('topBadge').innerText = 'Doğrulanmış';
                document.getElementById('displayName').innerText = userData.global_name;
                document.getElementById('usernameTag').innerText = `@${userData.username}`;
                
                // Discord Biyografisi Varsa Göster
                if (userData.bio && userData.bio.trim() !== "") {
                    document.getElementById('userDesc').innerText = userData.bio;
                } else {
                    document.getElementById('userDesc').innerText = "Henüz bir biyografi ayarlanmamış.";
                }

                document.getElementById('rolesList').innerHTML = '<span class="role-pill-ta" style="background:#0052ff; color:#fff;">ONAYLI ÜYE</span> <span class="role-pill-ta">NATO ASKERİ</span>';
            } else {
                document.getElementById('userAvatar').src = 'https://cdn.discordapp.com/embed/avatars/0.png';
                document.getElementById('topBadge').innerText = 'Misafir';
                document.getElementById('displayName').innerText = 'Giriş Yapılmadı';
                document.getElementById('usernameTag').innerText = '@misafir';
                document.getElementById('userDesc').innerText = 'Topluluğa henüz giriş yapılmadı.';
                document.getElementById('rolesList').innerHTML = '<span class="role-pill-ta" style="color:#ff3344;">Yetkisiz Misafir</span>';
            }
        }
    </script>
</body>
</html>
