<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATO Komuta Portalı</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
        }

        /* Üst Navbar */
        .navbar {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 20px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            margin-bottom: 20px;
            border: 1px solid #f1f5f9;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.3rem;
            color: #0f172a;
        }

        .logo-area span.badge-ta {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .nav-menu-btn {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #334155;
            font-size: 1.2rem;
        }

        /* Profil Kart Konteyneri */
        .profile-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            border: 1px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Avatar & Rozet */
        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 24px;
            object-fit: cover;
            border: 1px solid #e2e8f0;
        }

        .role-badge-overlay {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #334155;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 12px;
            white-space: nowrap;
        }

        .section-sub {
            font-size: 0.9rem;
            font-weight: 700;
            color: #64748b;
            margin-top: 10px;
        }

        /* Kullanıcı İsim Alanı */
        .user-title-area {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }

        .user-title-area h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        .user-title-area .username-tag {
            font-size: 1rem;
            font-weight: 600;
            color: #64748b;
        }

        .user-description {
            font-size: 0.95rem;
            color: #475569;
            font-weight: 500;
        }

        /* Canlı Rol Tag'leri */
        .roles-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .role-pill-ta {
            background: #e2e8f0;
            color: #334155;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Bilgi Kutusu */
        .info-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-box-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-box-value {
            font-size: 1.1rem;
            font-weight: 800;
            color: #0f172a;
        }

        /* İşlem Butonları */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 5px;
        }

        .btn-ta-primary {
            background: #ff758c;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(255, 117, 140, 0.25);
            transition: 0.2s;
            text-decoration: none;
        }

        .btn-ta-secondary {
            background: #ffffff;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            padding: 13px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            text-decoration: none;
        }

        .btn-ta-secondary:hover {
            background: #f8fafc;
        }

        /* Modal / Giriş */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.4);
            display: none;
            align-items: center; justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: #ffffff;
            width: 90%; max-width: 400px;
            border-radius: 20px; padding: 24px;
            display: flex; flex-direction: column; gap: 15px;
        }
    </style>
</head>
<body>

    <!-- Üst Bar -->
    <div class="navbar">
        <div class="logo-area">
            <span class="badge-ta">NATO</span> Komuta
        </div>
        <button class="nav-menu-btn" onclick="toggleModal()"><i class="fa-solid fa-bars"></i></button>
    </div>

    <!-- Giriş Modalı -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-content">
            <h3 style="font-size: 1.2rem; font-weight: 800;">Discord Doğrulama</h3>
            <p style="font-size: 0.85rem; color: #64748b;">Gerçek profilini ve rollerini görmek için Discord hesabını bağla:</p>
            <a href="https://discord.com/oauth2/authorize?client_id=1539374890405204070&response_type=code&redirect_uri=https%3A%2F%2Fnatox-mauve.vercel.app&scope=identify+email" class="btn-ta-primary" style="background: #5865F2; box-shadow: none;">
                <i class="fa-brands fa-discord"></i> Discord ile Giriş Yap
            </a>
            <button class="btn-ta-secondary" onclick="toggleModal()">Kapat</button>
        </div>
    </div>

    <!-- Ana Dinamik Profil Kartı -->
    <main class="profile-card">
        
        <!-- Profil Resmi & Rozet -->
        <div class="avatar-container">
            <img src="https://cdn.discordapp.com/embed/avatars/0.png" class="avatar-img" id="userAvatar" alt="Avatar">
            <div class="role-badge-overlay" id="topBadge">Misafir</div>
        </div>

        <div class="section-sub">Üye Profili</div>

        <!-- İsim & Kullanıcı Adı -->
        <div>
            <div class="user-title-area">
                <h2 id="displayName">Giriş Yapılmadı</h2>
                <span class="username-tag" id="usernameTag">@misafir</span>
            </div>
            <p class="user-description" id="userDesc" style="margin-top: 8px;">
                Topluluğa henüz giriş yapılmadı.
            </p>
        </div>

        <!-- Canlı Roller -->
        <div class="roles-list" id="rolesList">
            <span class="role-pill-ta" style="color: #ff3344;">Yetkisiz Misafir</span>
        </div>

        <!-- Discord Katılım Tarihi Kutusu -->
        <div class="info-box">
            <div class="info-box-title">DİSCORD'A KATILDI</div>
            <div class="info-box-value" id="joinDate">-</div>
        </div>

        <!-- Minecraft Nick Eşleme Kutusu -->
        <div class="info-box" style="gap: 8px;">
            <div class="info-box-title">MİNECRAFT OYUNCU ADI (IGN)</div>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="mcInput" placeholder="Minecraft Nickiniz" style="flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #cbd5e1; outline: none; font-weight: 600;">
                <button onclick="saveMc()" style="background: #0f172a; color: white; border: none; padding: 0 16px; border-radius: 10px; font-weight: 700; cursor: pointer;">Kaydet</button>
            </div>
        </div>

        <!-- İşlem Butonları -->
        <div class="action-buttons">
            <button class="btn-ta-primary" onclick="toggleModal()" id="loginActionBtn">
                <i class="fa-brands fa-discord"></i> Discord ile Bağlan / Giriş Yap
            </button>
            
            <button class="btn-ta-secondary" onclick="logout()">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Siteden Çıkış Yap
            </button>
        </div>

    </main>

    <script>
        const SITE_URL = "https://natox-mauve.vercel.app";

        function toggleModal() {
            const m = document.getElementById('loginModal');
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        }

        function saveMc() {
            const v = document.getElementById('mcInput').value.trim();
            if(v) {
                localStorage.setItem('nato_mc_nick', v);
                alert('Minecraft adınız (' + v + ') başarıyla kaydedildi!');
            }
        }

        function logout() {
            localStorage.clear();
            location.href = SITE_URL;
        }

        // Sayfa Yüklendiğinde Discord Code'unu Yakala ve Verileri Doldur
        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                try {
                    // Render üzerindeki bot backend adresimizden kullanıcının verilerini çekiyoruz
                    const response = await fetch(`${SITE_URL}/api/auth?code=${code}`);
                    const data = await response.json();

                    if (data.success) {
                        localStorage.setItem('nato_user', JSON.stringify(data.user));
                        localStorage.setItem('nato_logged_in', 'true');
                    }
                } catch (err) {
                    console.error("Giriş verisi alınamadı:", err);
                }
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            updateUI();
        };

        function updateUI() {
            const isLoggedIn = localStorage.getItem('nato_logged_in');
            const userData = JSON.parse(localStorage.getItem('nato_user') || '{}');
            const savedMc = localStorage.getItem('nato_mc_nick') || '';

            if (savedMc) {
                document.getElementById('mcInput').value = savedMc;
            }

            if (isLoggedIn === 'true' && userData.username) {
                document.getElementById('userAvatar').src = userData.avatarUrl;
                document.getElementById('topBadge').innerText = 'Doğrulanmış';
                document.getElementById('displayName').innerText = userData.global_name;
                document.getElementById('usernameTag').innerText = `@${userData.username}`;
                document.getElementById('userDesc').innerText = 'Topluluğa aktif NATO Operatörü olarak katkı sağlıyor.';
                
                // Katılım tarihi formatı
                if (userData.joinedAt) {
                    const dateObj = new Date(userData.joinedAt);
                    document.getElementById('joinDate').innerText = dateObj.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
                } else {
                    document.getElementById('joinDate').innerText = 'Kayıtlı Üye';
                }

                // Canlı Rol Etiketleri
                const rolesContainer = document.getElementById('rolesList');
                rolesContainer.innerHTML = '';
                if (userData.roles && userData.roles.length > 0) {
                    userData.roles.forEach(roleId => {
                        const span = document.createElement('span');
                        span.className = 'role-pill-ta';
                        span.innerText = `Rol: ${roleId.slice(-4)}`;
                        rolesContainer.appendChild(span);
                    });
                } else {
                    rolesContainer.innerHTML = '<span class="role-pill-ta">NATO Üyesi</span>';
                }

                // Giriş butonunu değiştir
                document.getElementById('loginActionBtn').innerHTML = '<i class="fa-solid fa-user-check"></i> Hesap Bağlı ve Doğrulanmış';
                document.getElementById('loginActionBtn').style.background = '#107C10';
                document.getElementById('loginActionBtn').onclick = () => alert('Zaten giriş yaptınız!');

            } else {
                // Giriş yapılmamış varsayılan durum
                document.getElementById('userAvatar').src = 'https://cdn.discordapp.com/embed/avatars/0.png';
                document.getElementById('topBadge').innerText = 'Misafir';
                document.getElementById('displayName').innerText = 'Giriş Yapılmadı';
                document.getElementById('usernameTag').innerText = '@misafir';
                document.getElementById('userDesc').innerText = 'Topluluğa henüz giriş yapılmadı.';
                document.getElementById('rolesList').innerHTML = '<span class="role-pill-ta" style="color:#ff3344;">Yetkisiz Misafir</span>';
                document.getElementById('joinDate').innerText = '-';
            }
        }
    </script>
</body>
</html>
