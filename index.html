<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NATO</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1a;--panel:#121b2c;--line:#24324d;--gold:#ffb800;--text:#e8edf6;--mute:#93a1ba;--blue:#0a8fc9;--ok:#2fbf71;--bad:#e5484d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 Inter,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,.brand{font-family:Oswald,Impact,sans-serif;letter-spacing:.02em;margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:12px 16px;background:#0d1627;border-bottom:3px solid var(--gold)}
.brand{font-size:32px;font-weight:700;color:var(--gold);flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 16px;color:var(--text);background:var(--line)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.icon{width:46px;height:46px;padding:0;background:var(--panel);border:1px solid var(--line);color:var(--gold);font-size:22px}
.primary{background:var(--blue);color:#fff;font-weight:600}
.gold{background:var(--gold);color:#1a1300;font-weight:600}
.danger{background:var(--bad);color:#fff}
.ok{background:var(--ok);color:#04150b}
#scrim{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,85vw);background:#0d1627;border-right:3px solid var(--gold);z-index:40;transform:translateX(-100%);transition:transform .3s ease;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px;display:flex;flex-direction:column;gap:4px;overflow:auto}
#drawer.on{transform:none}
#drawer h2{color:var(--gold);padding:4px 12px 12px;font-size:24px}
#drawer button{background:none;text-align:left;padding:13px 14px;font-size:17px;border-left:3px solid transparent;border-radius:0 8px 8px 0}
#drawer button.cur{background:var(--panel);border-left-color:var(--gold);color:var(--gold)}
main{flex:1;width:100%;max-width:860px;margin:0 auto;padding:24px 16px 40px}
.hero{padding:36px 0 28px;border-bottom:1px solid var(--line);margin-bottom:24px}
.hero h1{font-size:clamp(38px,9vw,64px);color:var(--gold);line-height:1.05}
.hero p{color:var(--mute);font-size:18px;max-width:60ch}
h2.t{font-size:28px;color:var(--gold);margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.card h3{font-size:22px;color:var(--gold);margin-bottom:6px}
.card p{margin:0 0 10px;color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1px solid #6b5316;background:#2a2312;color:var(--gold);padding:4px 12px;border-radius:6px;font-weight:600;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
input,select,textarea{width:100%;background:#0a0f1a;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:11px 12px;font:inherit}
label{display:block;color:var(--mute);font-size:14px;margin:12px 0 4px}
.badge{font-size:13px;padding:2px 10px;border-radius:99px;background:var(--line)}
.b-open{background:#123a28;color:#6ee7a1}.b-lock{background:#3a2a12;color:var(--gold)}.b-closed{background:#3a1519;color:#ff9aa0}
.msg{padding:10px 12px;border-radius:10px;background:#0a0f1a;margin:8px 0;border:1px solid var(--line)}
.msg.staff{border-color:#6b5316}
.msg small{color:var(--mute)}
.note{border-left:3px solid var(--gold);padding:8px 12px;background:#1d2434;color:var(--mute);font-size:14px;border-radius:0 8px 8px 0;margin-bottom:16px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--line);display:grid;place-items:center;font:700 22px Oswald,sans-serif;color:var(--gold)}
footer{border-top:1px solid var(--line);background:#0d1627;padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px));text-align:center}
footer nav{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
footer a,footer button.l{color:var(--text);background:none;padding:4px;text-decoration:underline;text-underline-offset:3px}
footer small{color:var(--mute)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--gold);border-radius:14px;max-width:min(440px,92vw);width:100%;padding:22px}
dialog::backdrop{background:#000b}
.oauth{width:100%;padding:14px;margin-top:10px;font-weight:600}
.discord{background:#5865f2;color:#fff}.mc{background:#3c8527;color:#fff}
.done{opacity:.7}
@media(prefers-reduced-motion:reduce){#drawer,#scrim{transition:none}}
</style>
</head>
<body>
<header>
  <button class="icon" id="homeBtn" aria-label="Menüyü aç">⌂</button>
  <div class="brand">NATO</div>
  <div id="authSlot"></div>
</header>
<div id="scrim"></div>
<aside id="drawer" aria-label="Bölümler"></aside>
<main id="main"></main>
<footer>
  <nav>
    <button class="l" data-doc="tos">Hizmet Şartları</button>
    <button class="l" data-doc="privacy">Gizlilik Politikası</button>
    <a href="https://discord.gg/ymv8D3WHNz" target="_blank" rel="noopener">Discord sunucumuz</a>
    <a href="https://youtube.com/@nato_delta?si=l6qxhNVICEX9g1np" target="_blank" rel="noopener">YouTube hesabımız</a>
  </nav>
  <small>© NATO. Resmî Discord ve Minecraft topluluğu.</small>
</footer>
<dialog id="dlg"></dialog>

<script>
/* ===== AYARLAR (buraya kendi bilgilerini yaz) ===== */
const YETKILILER = ["herobrine_sinan"]; // Discord kullanıcı adları: destek ve grup taleplerine bakabilir
const KATEGORILER = ["Ban Affı","Discord Destek","Askeri Şikayet","Ulusal Şikayet"];
const BRANSLAR = [
 {ad:"Kara Kuvvetleri",acik:"Karadan sorumlu branştır.",birim:["BÖRÜ","KHO","MUHABERE","ARAMA KURTARMA"]},
 {ad:"Sınır Müfettişleri",acik:"Sınırdan sorumlu branştır.",birim:["GARDİYAN","MUHAFIZLARI","DENETİM BİRİMİ"]},
 {ad:"Askerî İnzibat",acik:"Asayişten sorumlu branştır.",birim:["Yıldırım Orduları","Kızıl Sağ El"]},
 {ad:"Özel Kuvvetler",acik:"Operasyonlardan sorumlu branştır.",birim:["SAT","Özel Koruma Birliği","OMEGA"]}
];
const EMEK = [
 ["Herobrine_sinan","NATO Başkomutanı","NATO’nun askerî olmasını sağlayan lider."],
 ["Yusufg","Kurucu ve Yönetim Kurulu Başkanlarından biri","Ulusun ilk kurucularından biridir."],
 ["Omer_salih","Kurucu","Ulusun kurucularından biridir."],
 ["Tahirg","Kurucu","Ulusun kurucularından biridir."]
];
const BOTLAR = [["NATO","Ana bot. /update komutuyla onaylanan rolleri verir."],["NATO Moderasyon","Sunucu moderasyonu ve kayıtlar için kullanılır."]];
const DOCS = {
 tos:["Hizmet Şartları","Bu metin yer tutucudur. Kuralları, yaptırımları ve hesap kullanım şartlarını buraya yaz."],
 privacy:["Gizlilik Politikası","Bu metin yer tutucudur. Siteye Discord (kullanıcı adı, avatar, e-posta, sunucu listesi) ve Minecraft hesap verisinin neden alındığını ve nasıl saklandığını buraya yaz."]
};
const BOLUMLER = [["home","Ana Sayfa"],["destek","Destek"],["bransl","Branşlar"],["emek","Emeği Geçenler"],["gruplar","Gruplar"],["hesap","Hesap"],["botlar","Botlar"]];

/* ===== DURUM ===== */
let S = {user:null,tickets:[],reqs:[],demoStaff:false};
try{const r=localStorage.getItem("nato_v1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("nato_v1",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isStaff=()=>S.user&&(YETKILILER.includes(S.user.discord.toLowerCase())||S.demoStaff);
const now=()=>new Date().toLocaleString("tr-TR",{dateStyle:"short",timeStyle:"short"});
let view="home",openTicket=null;

/* ===== MENÜ ===== */
function buildDrawer(){
  $("#drawer").innerHTML="<h2>NATO</h2>"+BOLUMLER.map(([k,a])=>`<button data-go="${k}" class="${view===k?"cur":""}">${a}</button>`).join("");
}
function drawer(on){$("#drawer").classList.toggle("on",on);$("#scrim").classList.toggle("on",on)}
$("#homeBtn").onclick=()=>{buildDrawer();drawer(!$("#drawer").classList.contains("on"))};
$("#scrim").onclick=()=>drawer(false);
$("#drawer").onclick=e=>{const b=e.target.closest("[data-go]");if(b){go(b.dataset.go);drawer(false)}};
document.addEventListener("keydown",e=>{if(e.key==="Escape")drawer(false)});
document.querySelectorAll("[data-doc]").forEach(b=>b.onclick=()=>{const d=DOCS[b.dataset.doc];modal(`<h3 class="t" style="font-size:24px;color:var(--gold)">${d[0]}</h3><p>${d[1]}</p><button onclick="dlg.close()">Kapat</button>`)});

function modal(h){const d=$("#dlg");d.innerHTML=h;if(!d.open)d.showModal()}
const dlg=$("#dlg");

/* ===== ÜST ŞERİT: GİRİŞ ===== */
function authSlot(){
  $("#authSlot").innerHTML=S.user
   ?`<button class="icon" data-go2="hesap" aria-label="Hesap" style="color:var(--text)">${esc(S.user.discord[0].toUpperCase())}</button>`
   :`<button class="primary" id="loginBtn">Giriş Yap</button>`;
  const l=$("#loginBtn");if(l)l.onclick=loginModal;
  const a=document.querySelector("[data-go2]");if(a)a.onclick=()=>go("hesap");
}
let tmp={};
function loginModal(){
  modal(`<h3 style="font-size:24px;color:var(--gold)">Giriş Yap</h3>
  <p style="color:var(--mute)">Girmek için iki hesabını da bağlaman gerekir.</p>
  <button class="oauth discord" id="bd">${tmp.discord?"✓ Discord bağlandı: "+esc(tmp.discord):"Discord ile bağlan"}</button>
  <button class="oauth mc" id="bm">${tmp.mc?"✓ Minecraft bağlandı: "+esc(tmp.mc):"Minecraft (Microsoft) ile bağlan"}</button>
  <div class="note" style="margin-top:16px">Önizleme modu: gerçek Discord/Microsoft sayfası yerine kullanıcı adını elle yazıyorsun. Gerçek giriş sunucu kodu ister.</div>
  <div class="row sp"><button onclick="dlg.close()">İptal</button><button class="gold" id="bgo" ${tmp.discord&&tmp.mc?"":"disabled style='opacity:.4'"}>Devam et</button></div>`);
  $("#bd").onclick=()=>{const v=prompt("Discord kullanıcı adın (örn. sinansx):");if(v){tmp.discord=v.trim();loginModal()}};
  $("#bm").onclick=()=>{const v=prompt("Minecraft kullanıcı adın (örn. Herobrine_sinan):");if(v){tmp.mc=v.trim();loginModal()}};
  $("#bgo").onclick=()=>{if(!(tmp.discord&&tmp.mc))return;S.user={discord:tmp.discord,mc:tmp.mc,guilds:["NATO","Örnek Sunucu 1","Örnek Sunucu 2"]};tmp={};save();dlg.close();authSlot();go(view)};
}

/* ===== GÖRÜNÜMLER ===== */
function go(v){view=v;openTicket=null;buildDrawer();render();window.scrollTo(0,0)}
function render(){
  const m=$("#main");
  if(view==="home")m.innerHTML=`<section class="hero"><h1>NATO</h1><p>Hiyerarşi, disiplin ve operasyonel mükemmellik ilkesiyle hareket eden elit askerî topluluk.</p></section>
   <div class="card"><h3>Biz kimiz?</h3><p>NATO; Minecraft ve Discord üzerinde örgütlü, branşlara ve birimlere ayrılmış bir askerî topluluktur. Sol üstteki ev düğmesinden branşlara, destek taleplerine ve gruplara ulaşabilirsin.</p></div>
   <div class="row"><button class="gold" data-go3="bransl">Branşları gör</button><button data-go3="destek">Destek al</button></div>`;
  else if(view==="destek")destek(m);
  else if(view==="bransl")m.innerHTML=`<h2 class="t">Askerî Branşlar ve Birimler</h2>`+BRANSLAR.map(b=>`<div class="card"><h3>${b.ad}</h3><p>${b.acik}</p><div class="tags">${b.birim.map(x=>`<span class="tag">${x}</span>`).join("")}</div></div>`).join("");
  else if(view==="emek")m.innerHTML=`<h2 class="t">Emeği Geçenler</h2>`+EMEK.map(e=>`<div class="card row"><div class="avatar">${e[0][0]}</div><div><h3>${e[0]}</h3><b>${e[1]}</b><p style="margin:0">${e[2]}</p></div></div>`).join("");
  else if(view==="gruplar")gruplar(m);
  else if(view==="hesap")hesap(m);
  else if(view==="botlar")m.innerHTML=`<h2 class="t">Botlar</h2>`+BOTLAR.map(b=>`<div class="card row"><div class="avatar">${b[0][0]}</div><div><h3>${b[0]}</h3><p style="margin:0">${b[1]}</p></div></div>`).join("");
  document.querySelectorAll("[data-go3]").forEach(b=>b.onclick=()=>go(b.dataset.go3));
}
function needLogin(m,t){m.innerHTML=`<h2 class="t">${t}</h2><div class="card"><p>Bu bölümü kullanmak için giriş yapmalısın.</p><button class="primary" id="l2">Giriş Yap</button></div>`;$("#l2").onclick=loginModal}

/* --- Destek --- */
function destek(m){
  if(!S.user)return needLogin(m,"Destek");
  if(openTicket!==null)return ticketView(m);
  const list=S.tickets.filter(t=>isStaff()||t.owner===S.user.discord);
  m.innerHTML=`<h2 class="t">Destek</h2>
  <div class="card"><h3>Yeni talep aç</h3>
   <label>Kategori</label><select id="tc">${KATEGORILER.map(k=>`<option>${k}</option>`).join("")}</select>
   <label>Konu</label><input id="ts" maxlength="80">
   <label>Açıklama</label><textarea id="td" rows="4"></textarea>
   <p style="margin-top:10px;font-size:14px">Talebi açtığında bulunduğun Discord sunucuları yalnızca yetkililere görünür.</p>
   <button class="gold" id="tn">Talebi aç</button></div>
  <h3 style="margin:22px 0 10px">${isStaff()?"Tüm talepler":"Taleplerim"}</h3>
  ${list.length?list.map(t=>`<div class="card"><div class="row sp"><b>#${t.id} ${esc(t.konu)}</b><span class="badge b-${t.durum}">${{open:"Açık",lock:"Kilitli",closed:"Kapalı"}[t.durum]}</span></div><p style="margin:4px 0 10px">${t.kat} · ${esc(t.owner)}${t.sahip?" · Sahiplenen: "+esc(t.sahip):""}</p><button data-t="${t.id}">Aç</button></div>`).join(""):`<div class="card"><p style="margin:0">Henüz talep yok. Yukarıdan ilk talebini aç.</p></div>`}`;
  $("#tn").onclick=()=>{const s=$("#ts").value.trim(),d=$("#td").value.trim();if(!s||!d){alert("Konu ve açıklama yaz.");return}
    const id=S.tickets.length+1;S.tickets.push({id,kat:$("#tc").value,konu:s,owner:S.user.discord,mc:S.user.mc,guilds:S.user.guilds,durum:"open",sahip:null,msgs:[{k:S.user.discord,y:false,t:d,z:now()}]});save();openTicket=id;render()};
  m.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{openTicket=+b.dataset.t;render()});
}
function ticketView(m){
  const t=S.tickets.find(x=>x.id===openTicket);if(!t){openTicket=null;return destek(m)}
  const st=isStaff(),can=t.durum==="open"||st&&t.durum!=="closed";
  m.innerHTML=`<button id="bk">← Taleplere dön</button>
  <div class="card" style="margin-top:14px"><div class="row sp"><h3>#${t.id} ${esc(t.konu)}</h3><span class="badge b-${t.durum}">${{open:"Açık",lock:"Kilitli",closed:"Kapalı"}[t.durum]}</span></div><p style="margin:0">${t.kat} · ${esc(t.owner)} · MC: ${esc(t.mc)}</p></div>
  ${st?`<div class="card"><h3>Yetkili bölümü</h3>
    <div class="row"><button class="gold" id="a1">${t.sahip?"Bırak":"Sahiplen"}</button><button id="a2">${t.durum==="lock"?"Kilidi aç":"Kilitle"}</button><button class="danger" id="a3">${t.durum==="closed"?"Yeniden aç":"Kapat"}</button></div>
    <p style="margin:12px 0 6px">Talep sahibinin Discord sunucuları:</p><div class="tags">${t.guilds.map(g=>`<span class="tag">${esc(g)}</span>`).join("")}</div></div>`:""}
  <div class="card"><h3>Yazışma</h3>${t.msgs.map(x=>`<div class="msg ${x.y?"staff":""}"><small>${esc(x.k)}${x.y?" (yetkili)":""} · ${x.z}</small><br>${esc(x.t)}</div>`).join("")}
   ${can&&t.durum!=="lock"||st&&t.durum==="lock"?`<textarea id="mt" rows="3" placeholder="Mesajını yaz"></textarea><button class="primary" id="ms" style="margin-top:8px">Gönder</button>`:`<p style="margin:0">Bu talebe mesaj yazılamıyor.</p>`}</div>`;
  $("#bk").onclick=()=>{openTicket=null;render()};
  const ms=$("#ms");if(ms)ms.onclick=()=>{const v=$("#mt").value.trim();if(!v)return;t.msgs.push({k:S.user.discord,y:st,t:v,z:now()});save();render()};
  if(st){
   $("#a1").onclick=()=>{t.sahip=t.sahip?null:S.user.discord;save();render()};
   $("#a2").onclick=()=>{t.durum=t.durum==="lock"?"open":"lock";save();render()};
   $("#a3").onclick=()=>{t.durum=t.durum==="closed"?"open":"closed";save();render()};
  }
}

/* --- Gruplar --- */
function gruplar(m){
  if(!S.user)return needLogin(m,"Gruplar");
  const mine=ad=>S.reqs.find(r=>r.u===S.user.discord&&r.g===ad);
  let h=`<h2 class="t">Gruplar</h2><div class="note">Bir gruba istek at. Yetkililer onaylarsa, Discord’da NATO botuna <b>/update</b> yazınca o grubun rolleri verilir.</div>`;
  h+=BRANSLAR.map(b=>`<div class="card"><h3>${b.ad}</h3>${[b.ad+" (genel)",...b.birim].map(g=>{const r=mine(g);return `<div class="row sp" style="padding:8px 0;border-top:1px solid var(--line)"><span>${g}</span>${r?`<span class="badge ${r.d==="onay"?"b-open":r.d==="red"?"b-closed":"b-lock"}">${{bekle:"Beklemede",onay:"Onaylandı",red:"Reddedildi"}[r.d]}</span>`:`<button data-g="${esc(g)}">İstek at</button>`}</div>`}).join("")}</div>`).join("");
  if(isStaff()){
    const p=S.reqs.filter(r=>r.d==="bekle");
    h+=`<h3 style="margin:22px 0 10px">Bekleyen istekler (yetkili)</h3>`+(p.length?p.map((r,i)=>`<div class="card row sp"><span><b>${esc(r.u)}</b> → ${esc(r.g)}</span><span class="row"><button class="ok" data-d="onay" data-i="${S.reqs.indexOf(r)}">Onayla</button><button class="danger" data-d="red" data-i="${S.reqs.indexOf(r)}">Reddet</button></span></div>`).join(""):`<div class="card"><p style="margin:0">Bekleyen istek yok.</p></div>`);
  }
  m.innerHTML=h;
  m.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.reqs.push({u:S.user.discord,g:b.dataset.g,d:"bekle"});save();render()});
  m.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.reqs[+b.dataset.i].d=b.dataset.d;save();render()});
}

/* --- Hesap --- */
function hesap(m){
  if(!S.user)return needLogin(m,"Hesap");
  m.innerHTML=`<h2 class="t">Hesap</h2>
  <div class="card row"><div class="avatar">${esc(S.user.discord[0].toUpperCase())}</div><div><h3>Discord</h3><p style="margin:0">${esc(S.user.discord)}</p></div></div>
  <div class="card row"><div class="avatar" style="color:var(--ok)">M</div><div><h3>Minecraft</h3><p style="margin:0">${esc(S.user.mc)}</p></div></div>
  <div class="card"><label style="display:flex;gap:10px;align-items:center;margin:0"><input type="checkbox" id="ds" style="width:auto" ${S.demoStaff?"checked":""}> Önizleme: yetkili olarak gör</label>
  <p style="margin:8px 0 0;font-size:14px">Gerçek sitede yetki, koddaki YETKİLİLER listesinden gelir; bu kutu yalnızca denemek içindir.</p></div>
  <button class="danger" id="lo">Çıkış yap</button>`;
  $("#ds").onchange=e=>{S.demoStaff=e.target.checked;save()};
  $("#lo").onclick=()=>{S.user=null;S.demoStaff=false;save();authSlot();go("home")};
}

authSlot();buildDrawer();render();
</script>
</body>
    </html>
